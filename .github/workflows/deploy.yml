name: Deploy

on:
  push:
    branches: [main]
  # Re-runs a deploy by hand, for example after Pages is first set to deploy from Actions.
  workflow_dispatch:

# Each job grants itself only what it needs.
permissions: {}

# One deploy at a time. A newer push waits for the running deploy to finish instead of
# canceling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Loads `mise.toml` only, so the development tools in `mise.dev.toml` are skipped (ADR 0005).
      MISE_ENV: ci
    permissions:
      contents: read
      # configure-pages reads the Pages settings and fails early if Pages is not set up.
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs Node and pnpm at the versions in `mise.lock` (see `ci.yml`).
      - uses: jdx/mise-action@v5

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # Installs the dependencies, then prerenders every page into dist/client/, the root of
      # the published Site.
      - name: Prerendered build
        run: mise run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      # Lets deploy-pages prove to Pages that this run is allowed to deploy.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
