name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    env:
      # Loads `mise.toml` only, so the development tools in `mise.dev.toml` are skipped (ADR 0005).
      MISE_ENV: ci
    steps:
      - uses: actions/checkout@v7

      # Installs Node and pnpm at the versions in `mise.lock`. A lockfile makes the action pass
      # `--locked`, so a missing entry or a wrong checksum fails the run.
      - uses: jdx/mise-action@v5

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # The same `check` task as `mise run check` locally. With `--continue-on-error`, every
      # check runs even when another fails, so one run reports every failure.
      - name: Checks
        run: mise run --continue-on-error check
