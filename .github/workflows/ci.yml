name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      # Each check runs even when an earlier check fails, so one run reports every failure.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Biome
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec biome ci .

      - name: Module boundaries (dependency-cruiser)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm boundaries

      - name: Vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Prerendered build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
